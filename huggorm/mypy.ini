[mypy]
# The DSL's floor. huggorm itself allows 3.11, and mypy sets the version
# once per run.
python_version = 3.14
strict = True
files =
    packages/huggorm-dsl/src/huggorm_dsl,
    packages/huggorm-decl/src/huggorm_decl,
    packages/huggorm-gen/src/huggorm_gen,
    packages/huggorm/huggorm,
    packages/huggorm/tests,
    packages/huggorm-gen/tests,
    examples
mypy_path =
    packages/huggorm-dsl/src,
    packages/huggorm-decl/src,
    packages/huggorm-gen/src,
    packages/huggorm,
    packages/huggorm/tests,
    packages/huggorm-gen/tests,
    examples
explicit_package_bases = True
# The tree is checked against the default Nix, the lane of
# `nixVersions.latest` and no fork, whose stubs `ourPython` carries. Each version's own
# build checks the suite against its own stubs, and `check` refuses
# lists here that differ from the gates default.nix derives.
always_true = NIX_2_35
always_false = NIX_2_36, DETERMINATE

# A declaration's body is a docstring and at most one `Cxx(...)`, and
# the emitter writes the real one; `read.py` refuses any other shape.
# So a body that returns nothing is the DSL, not a defect. Only these
# two codes: every other error in a declaration is real (nixidae/nixidae#641).
[mypy-huggorm_decl.decl.*]
disable_error_code = empty-body, return

# nanobind ships no stubs, and only `huggorm-bindings/setup.py` imports
# it, for two paths.
[mypy-nanobind]
ignore_missing_imports = True
