[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynix-review"
license = "Apache-2.0"
version = "0.1.0"
description = "What a nixpkgs change rebuilds, layered by depth, with the time Hydra took to build it"
requires-python = ">=3.13"
dependencies = [
  "anyio",
  "httpx",
  "huggorm",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pynix_review"]
