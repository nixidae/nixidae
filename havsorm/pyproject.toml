[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "havsorm"
version = "0.1.0"
description = "Salt states written in Nix, evaluated in process by huggorm"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["huggorm"]

# Salt reads this group from every installed package. A package entry
# point makes each subdirectory a module type: `renderers/nix.py` is the
# `#!nix` renderer.
[project.entry-points."salt.loader"]
havsorm = "havsorm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
extend = "nix/shared/ruff.toml"
line-length = 100
target-version = "py311"

# Salt's loader sets `__opts__`, `__grains__` and `__pillar__` on each
# module it loads, after the import.
[tool.ruff.lint.per-file-ignores]
"src/havsorm/renderers/*.py" = ["F821"]
"src/havsorm/pillar/*.py" = ["F821"]
"src/havsorm/modules/*.py" = ["F821"]
"src/havsorm/states/*.py" = ["F821"]
