[mypy]
strict = True
python_version = 3.12
# zuban skips a `mypy_path` entry below another `files` entry: `tests/python`
# stays listed on its own.
files =
    src/pydd,
    tests,
    tests/python,
    tools
# pytest puts each test's own directory on `sys.path`, and tests import their
# neighbours.
mypy_path = src, tests/python, tests
# Fixture projects: each runs in the environment pydd builds for it. zuban
# matches the path below `tests`, a `mypy_path` entry, as `projects/...`.
exclude = (^|/)projects/
explicit_package_bases = True
