[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pydd"
version = "0.1.0"
description = "Dynamic derivations, planned in Python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
huggorm = ["huggorm"]
venv = ["packaging"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pydd has no installed package: its planners read `src/` as it is.
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
extend = "nix/shared/ruff.toml"
target-version = "py312"

# A node reads its derivation's attributes, and Nix names them in lower case.
[tool.ruff.lint.per-file-ignores]
"src/pydd/python/scripts/*" = ["SIM112"]
"src/pydd/python/_*.py" = ["SIM112"]
