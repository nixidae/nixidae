    - name: Run UBSAN-instrumented suite (nix_2_34, local backend)
      run: ./result/bin/nanopynix-ci suite
      timeout-minutes: 30
    - name: Run the concurrency soak (UBSAN, nix_2_34)
      run: ./result/bin/nanopynix-ci soak
      timeout-minutes: 15
    - if: ${{ !cancelled() }}
      name: Upload UBSAN output (nix_2_34)
      timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: ubsan-report-nix_2_34
        path: ${{ github.workspace }}/ubsan-output-nix_2_34.log
    timeout-minutes: 195
  test-ubsan-nix_2_35:
    env:
      CI_STEP: ciSteps.nix_2_35-ubsan
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',test-ubsan-nix_2_35,')
    runs-on: ubuntu-24.04
    steps:
    - if: runner.os == 'Linux'
      name: Make room on the runner
      run: df -h /; sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox; docker system prune --all --force; docker builder prune --all --force; df -h /
      timeout-minutes: 10
      working-directory: /
    - timeout-minutes: 10
      uses: actions/checkout@main
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          experimental-features = nix-command flakes
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: lillecarl
        useDaemon: false
    - name: Build the UBSAN CI step package (nix_2_35)
      run: nix build --file . "$CI_STEP" --out-link result --print-build-logs --print-out-paths
      timeout-minutes: 60
    - name: Enable Nix sandbox namespaces
      run: nix run --file . ciSteps.enable-sandbox-namespaces
      timeout-minutes: 10
    - name: Run UBSAN-instrumented suite (nix_2_35, local backend)
      run: ./result/bin/nanopynix-ci suite
      timeout-minutes: 30
    - name: Run the concurrency soak (UBSAN, nix_2_35)
      run: ./result/bin/nanopynix-ci soak
      timeout-minutes: 15
    - if: ${{ !cancelled() }}
      name: Upload UBSAN output (nix_2_35)
      timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: ubsan-report-nix_2_35
        path: ${{ github.workspace }}/ubsan-output-nix_2_35.log
    timeout-minutes: 195
name: 'nanopynix: On commit'
'on':
  push:
    branches-ignore:
    - ci-develop
  workflow_dispatch:
    inputs:
      jobs:
        default: ''
        description: Comma-separated job IDs to run; leave empty for the full matrix
        required: false
        type: string
