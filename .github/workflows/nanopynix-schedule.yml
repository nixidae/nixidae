        sudo "$(command -v nix)" store info --store 'ssh-ng://gha@37.27.129.237:2234?ssh-key=/etc/nix/remote-builder-key&base64-ssh-public-host-key=c3NoLWVkMjU1MTkgQUFBQUMzTnphQzFsWkRJMU5URTVBQUFBSUF0R0xKdjVSanpVdU9HV25zYVRSRXNuQWo2eFZwcEFuZWdhWFdma0pISGw='
      timeout-minutes: 5
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: lillecarl
        useDaemon: false
    - name: Build the UBSAN CI step package (${{ matrix.version }})
      run: nix build --file . "$CI_STEP" --out-link result --print-build-logs --print-out-paths
      timeout-minutes: 60
    - name: Enable Nix sandbox namespaces
      run: nix run --file . internal.ciSteps.enable-sandbox-namespaces
      timeout-minutes: 10
    - name: Run UBSAN-instrumented suite (${{ matrix.version }})
      run: ./result/bin/nanopynix-ci suite
      timeout-minutes: 30
    - if: ${{ !cancelled() }}
      name: Upload UBSAN output (${{ matrix.version }})
      timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: ubsan-report-${{ matrix.version }}
        path: ${{ github.workspace }}/ubsan-output-${{ matrix.version }}.log
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.version-matrix.outputs.ubsan_versions) }}
    timeout-minutes: 180
  version-matrix:
    outputs:
      asan_versions: ${{ steps.versions.outputs.asan_versions }}
      nogc_versions: ${{ steps.versions.outputs.nogc_versions }}
      regular_versions: ${{ steps.versions.outputs.regular_versions }}
      tsan_versions: ${{ steps.versions.outputs.tsan_versions }}
      ubsan_versions: ${{ steps.versions.outputs.ubsan_versions }}
    runs-on: ubuntu-24.04
    steps:
    - if: runner.os == 'Linux'
      name: Make room on the runner
      run: df -h /; sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox; docker system prune --all --force; docker builder prune --all --force; df -h /
      timeout-minutes: 10
      working-directory: /
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        ref: ${{ github.ref_name }}
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          experimental-features = nix-command flakes
    - env:
        REMOTE_BUILDER_KEY: ${{ secrets.PYNIXD_BUILDER_KEY }}
      if: runner.os == 'Linux' && contains(fromJSON('["Lillecarl"]'), github.actor)
      name: Build and substitute on ssh-ng://gha@37.27.129.237:2234
      run: |
        if [ -z "$REMOTE_BUILDER_KEY" ]; then echo "no PYNIXD_BUILDER_KEY: building on the runner"; exit 0; fi
        printf '%s\n' "$REMOTE_BUILDER_KEY" | sudo install -m 0600 /dev/stdin /etc/nix/remote-builder-key
        sudo tee -a /etc/nix/nix.conf <<'EOF'
        builders = ssh-ng://gha@37.27.129.237:2234 x86_64-linux /etc/nix/remote-builder-key 16 2 benchmark,big-parallel,kvm,nixos-test,recursive-nix,uid-range - c3NoLWVkMjU1MTkgQUFBQUMzTnphQzFsWkRJMU5URTVBQUFBSUF0R0xKdjVSanpVdU9HV25zYVRSRXNuQWo2eFZwcEFuZWdhWFdma0pISGw=
        builders-use-substitutes = true
        extra-substituters = ssh-ng://gha@37.27.129.237:2234?ssh-key=/etc/nix/remote-builder-key&base64-ssh-public-host-key=c3NoLWVkMjU1MTkgQUFBQUMzTnphQzFsWkRJMU5URTVBQUFBSUF0R0xKdjVSanpVdU9HV25zYVRSRXNuQWo2eFZwcEFuZWdhWFdma0pISGw=&trusted=1&priority=2
        EOF
        sudo systemctl restart nix-daemon
        # As root, the user the daemon dials the remote as: the key is root's alone.
        sudo "$(command -v nix)" store info --store 'ssh-ng://gha@37.27.129.237:2234?ssh-key=/etc/nix/remote-builder-key&base64-ssh-public-host-key=c3NoLWVkMjU1MTkgQUFBQUMzTnphQzFsWkRJMU5URTVBQUFBSUF0R0xKdjVSanpVdU9HV25zYVRSRXNuQWo2eFZwcEFuZWdhWFdma0pISGw='
      timeout-minutes: 5
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: lillecarl
        useDaemon: false
    - id: versions
      name: Compute Nix version matrices
      run: nix run --file . internal.ciSteps.version-matrix
      timeout-minutes: 20
    timeout-minutes: 85
name: 'nanopynix: On schedule'
'on':
