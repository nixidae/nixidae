defaults:
  run:
    working-directory: pynixd
jobs:
  extended:
    runs-on: ubuntu-latest
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
    - if: runner.os == 'Linux'
      name: Make room on the runner
      run: df -h /; sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox; docker system prune --all --force; docker builder prune --all --force; df -h /
      timeout-minutes: 10
      working-directory: /
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          experimental-features = nix-command flakes read-only-local-store ca-derivations dynamic-derivations recursive-nix
          substituters = https://cache.nixos.org?priority=1 https://nixkube.cachix.org?priority=2 https://lillecarl.cachix.org?priority=3
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nixkube.cachix.org-1:H8UE0jlI9pxHexK/NhDmEoLDarJXp1WTymQrsajlh7M= lillecarl.cachix.org-1:NN/LLMg7mbyvZCu32Qlo8LpSHqNw7Rr3VBCEYQvRpT0=
          trusted-users = root runner
        install_url: https://releases.nixos.org/nix/nix-2.35.2/install
    - env:
        REMOTE_BUILDER_KEY: ${{ secrets.PYNIXD_BUILDER_KEY }}
      if: runner.os == 'Linux' && contains(fromJSON('["Lillecarl"]'), github.actor)
      name: Build and substitute on ssh-ng://gha@37.27.129.237:2234
      run: |
        if [ -z "$REMOTE_BUILDER_KEY" ]; then echo "no PYNIXD_BUILDER_KEY: building on the runner"; exit 0; fi
        printf '%s\n' "$REMOTE_BUILDER_KEY" | sudo install -m 0600 /dev/stdin /etc/nix/remote-builder-key
        sudo mkdir -p /etc/nix-daemon /etc/systemd/system/nix-daemon.service.d
        sudo tee /etc/nix-daemon/nix.conf <<'EOF'
        include /etc/nix/nix.conf
        builders = ssh-ng://gha@37.27.129.237:2234 x86_64-linux /etc/nix/remote-builder-key 16 2 benchmark,big-parallel,recursive-nix - c3NoLWVkMjU1MTkgQUFBQUMzTnphQzFsWkRJMU5URTVBQUFBSUF0R0xKdjVSanpVdU9HV25zYVRSRXNuQWo2eFZwcEFuZWdhWFdma0pISGw=
        builders-use-substitutes = true
        extra-substituters = ssh-ng://gha@37.27.129.237:2234?ssh-key=/etc/nix/remote-builder-key&base64-ssh-public-host-key=c3NoLWVkMjU1MTkgQUFBQUMzTnphQzFsWkRJMU5URTVBQUFBSUF0R0xKdjVSanpVdU9HV25zYVRSRXNuQWo2eFZwcEFuZWdhWFdma0pISGw=&trusted=1&priority=2
        EOF
        printf '[Service]\nEnvironment=NIX_CONF_DIR=/etc/nix-daemon\n' | sudo tee /etc/systemd/system/nix-daemon.service.d/remote-builder.conf
        sudo systemctl daemon-reload
        sudo systemctl restart nix-daemon
        # As root, the user the daemon dials the remote as: the key is root's alone.
        sudo "$(command -v nix)" store info --store 'ssh-ng://gha@37.27.129.237:2234?ssh-key=/etc/nix/remote-builder-key&base64-ssh-public-host-key=c3NoLWVkMjU1MTkgQUFBQUMzTnphQzFsWkRJMU5URTVBQUFBSUF0R0xKdjVSanpVdU9HV25zYVRSRXNuQWo2eFZwcEFuZWdhWFdma0pISGw='
      timeout-minutes: 5
    - name: Allow the unprivileged user namespaces Nix and passt need
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; sudo sysctl -w kernel.unprivileged_userns_clone=1; unshare --user --map-root-user --mount --pid --fork --mount-proc true
      timeout-minutes: 5
    - name: Generate SSH key for ssh-ng:// tests
      run: |
        mkdir -p ~/.ssh
        ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -q
    - name: Extended client tests
      run: nix develop --impure --file shell.nix --command pytest tests/client -m extended
    - name: Extended client tests on nix_2_34
      run: nix develop --impure --file . internal.laneShells.nix_2_34 --command pytest tests/client -m extended
    - name: Extended client tests on git
      run: nix develop --impure --file . internal.laneShells.git --command pytest tests/client -m extended
    - name: Extended client tests on determinate
      run: nix develop --impure --file . internal.laneShells.determinate --command pytest tests/client -m extended
    timeout-minutes: 120
name: 'pynixd: extended'
'on':
  schedule:
  - cron: 41 2 * * *
  workflow_dispatch: null
