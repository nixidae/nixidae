defaults:
  run:
    working-directory: huggorm
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          experimental-features = nix-command flakes
    - uses: cachix/cachix-action@master
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: lillecarl
        useDaemon: false
    - name: Lint, typecheck, clang -Werror
      run: nix run --file . check
    timeout-minutes: 120
  suite:
    env:
      LANE: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          experimental-features = nix-command flakes
    - uses: cachix/cachix-action@master
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: lillecarl
        useDaemon: false
    - name: Build the lane's suite
      run: nix build --file . "lanes.\"$LANE\".suite" --no-link --print-build-logs
    strategy:
      fail-fast: false
      matrix:
        lane:
        - determinate
        - determinate-asan
        - determinate-nogc
        - determinate-tsan
        - determinate-ubsan
        - git
        - git-asan
        - git-nogc
        - git-tsan
        - git-ubsan
        - nix_2_34
        - nix_2_34-asan
        - nix_2_34-nogc
        - nix_2_34-tsan
        - nix_2_34-ubsan
        - nix_2_35
        - nix_2_35-asan
        - nix_2_35-nogc
        - nix_2_35-tsan
        - nix_2_35-ubsan
    timeout-minutes: 120
name: 'huggorm: tests'
'on':
  pull_request: null
  push: null
