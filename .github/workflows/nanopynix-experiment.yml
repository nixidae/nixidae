# Edit the source's ciTestWorkflows, then run: nix run --file . ci-workflow-update
defaults:
  run:
    working-directory: nanopynix
jobs:
  experiment:
    runs-on: ${{ inputs.runner }}
    steps:
    - if: runner.os == 'Linux'
      name: Make room on the runner
      run: df -h /; sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox; docker system prune --all --force; docker builder prune --all --force; df -h /
      timeout-minutes: 10
      working-directory: /
    - timeout-minutes: 10
      uses: actions/checkout@main
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          experimental-features = nix-command flakes
    - env:
        REF: ${{ inputs.ref }}
      name: Check the ref
      run: nix run --file . internal.ciSteps.check-dispatch-ref
      timeout-minutes: 10
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        ref: ${{ inputs.ref }}
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: lillecarl
        useDaemon: false
    - name: Enable Nix sandbox namespaces
      run: nix run --file . internal.ciSteps.enable-sandbox-namespaces
      timeout-minutes: 10
    - env:
        EXPERIMENT: ${{ inputs.experiment }}
        MATRIX_JSON: ${{ toJSON(matrix) }}
      name: Run ${{ inputs.experiment }}
      run: nix run --file . "internal.experiments.$EXPERIMENT"
      timeout-minutes: 60
    - if: ${{ failure() }}
      name: Keep the evidence of a failed cell
      timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: experiment-${{ inputs.experiment }}-${{ strategy.job-index }}
        path: |
          /tmp/core.*
          nanopynix/.pytest-agent/
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    timeout-minutes: 170
name: 'nanopynix: Experiment'
'on':
  workflow_dispatch:
    inputs:
      experiment:
        description: Attribute of ci/experiments.nix to run
        required: true
        type: string
      matrix:
        default: '{"run":[1]}'
        description: JSON matrix, for example {"arm":["a","b"],"run":[1,2]}
        required: false
        type: string
      ref:
        default: ci-develop
        description: Branch, tag, or FULL 40-character sha to check out
        required: false
        type: string
      runner:
        default: ubuntu-24.04
        description: Runner to use
        options:
        - ubuntu-24.04
        - ubuntu-24.04-arm
        required: false
        type: choice
