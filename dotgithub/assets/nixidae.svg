  <title>Nixidae Colorflake — polished 2.45× avatar mark</title>
  <desc>Python glyph geometry and gradients preserved from the Python logo; Nix lambda geometry preserved, with Nix-style three-stop gradient construction.</desc>
  <defs>
    <!-- Outer arms: exact NixOS gradient vector + 0/25/100 stop construction. -->
    <!-- Python-blue ramp: original Python endpoint colors, midpoint color at Nix's 25% stop. -->
    <linearGradient id="pyBlue" gradientUnits="userSpaceOnUse"
      x1="-319.9999999999999" y1="-554.2562584220408"
      x2="127.99999999999996" y2="221.70250336881628">
      <stop offset="0%" stop-color="#306998" />
      <stop offset="25%" stop-color="#4584B6" />
      <stop offset="100%" stop-color="#5A9FD4" />
    </linearGradient>

    <!-- Official NixOS light gradient, verbatim. -->
    <linearGradient id="nixLight" gradientUnits="userSpaceOnUse"
      x1="-319.9999999999999" y1="-554.2562584220408"
      x2="127.99999999999996" y2="221.70250336881628">
      <stop offset="0%" stop-color="#6D9BBC" />
      <stop offset="25%" stop-color="#72A9CF" />
      <stop offset="100%" stop-color="#77B6E1" />
    </linearGradient>

    <!-- Python-yellow ramp: original Python endpoint colors, midpoint color at Nix's 25% stop. -->
    <linearGradient id="pyYellow" gradientUnits="userSpaceOnUse"
      x1="-319.9999999999999" y1="-554.2562584220408"
      x2="127.99999999999996" y2="221.70250336881628">
      <stop offset="0%" stop-color="#FFD43B" />
      <stop offset="25%" stop-color="#FFDE57" />
      <stop offset="100%" stop-color="#FFE873" />
    </linearGradient>

    <linearGradient id="pySrcYellowBase">
      <stop style="stop-color:#ffd43b;stop-opacity:1;" offset="0" />
      <stop style="stop-color:#ffe873;stop-opacity:1" offset="1" />
    </linearGradient>
    <linearGradient id="pySrcBlueBase">
      <stop style="stop-color:#5a9fd4;stop-opacity:1;" offset="0" />
      <stop style="stop-color:#306998;stop-opacity:1;" offset="1" />
    </linearGradient>
    <linearGradient xlink:href="#pySrcYellowBase" id="pySrcYellow" gradientUnits="userSpaceOnUse"
      gradientTransform="matrix(0.562541,0,0,0.567972,-14.99112,-11.702371)"
      x1="150.96111" y1="192.35176" x2="112.03144" y2="137.27299" />
    <linearGradient xlink:href="#pySrcBlueBase" id="pySrcBlue" gradientUnits="userSpaceOnUse"
      gradientTransform="matrix(0.562541,0,0,0.567972,-14.99112,-11.702371)"
      x1="26.648937" y1="20.603781" x2="135.66525" y2="114.39767" />
</defs>
