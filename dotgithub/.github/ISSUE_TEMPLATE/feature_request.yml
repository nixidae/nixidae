name: Feature request
description: Suggest something the project should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals are welcome, including ones that get declined — these are
        small projects with opinions about scope, and saying no to a good idea
        that does not belong here is a normal outcome.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the situation you are in, not the feature you have in mind.
        The workaround you are using today is useful context.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
      description: >
        If you have an API, flag or module option in mind, sketch it — even
        roughly. Concrete proposals are much easier to discuss than abstract
        ones.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: >
        Including "do nothing" and other tools that already solve this.
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to implement this?
      options:
        - "Yes, with guidance on the approach"
        - "Yes, I have a rough patch already"
        - "No, but I would test it"
        - "No"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not already been proposed.
          required: true
