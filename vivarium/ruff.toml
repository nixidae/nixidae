extend = "nix/shared/ruff-anyio.toml"

target-version = "py312"

# A spike run by hand for the measurements in
# docs/design/console-guests.md. No build reads it.
extend-exclude = ["tests/fixtures/routeros/probe.py"]

[lint]
# A library module speaks through `Session.emit`, `Machine.say` or a
# callback: a print there misses `events.jsonl` and the guest's name.
# Phase scripts, programs and tests print.
# S101: `python -O` drops an assert, so a check in a library raises.
# PLC0415: imports at the top; a cycle moves the shared piece out.
extend-select = ["T201", "S101", "PLC0415"]

[lint.isort]
required-imports = ["from __future__ import annotations"]

[lint.extend-per-file-ignores]
"{docs,examples,lab,recipes,tests}/**" = ["T201", "S101", "PLC0415"]
"pkgs/*/tests/**" = ["T201", "S101", "PLC0415"]
"pkgs/vyos-footer.py" = ["T201"]
"pkgs/vivarium/vivarium/{cli,monitor,repl,sinks}.py" = ["T201"]
"pkgs/vivarium-eval/vivarium_eval/cli.py" = ["T201"]
# The agent's ready line is its protocol; nixos_test is the
# nixos-test script surface, which prints as a phase does.
"pkgs/vivarium-runner/vivarium_runner/{agent,cli,nixos_test}.py" = ["T201"]

[format]
# The examples in the docs are short on purpose: a comment beside each
# line, no blank lines between definitions.
exclude = ["*.md"]
