extend = "nix/shared/ruff-anyio.toml"

target-version = "py312"

# A spike run by hand for the measurements in
# docs/design/console-guests.md. No build reads it.
extend-exclude = ["tests/fixtures/routeros/probe.py"]

[format]
# The examples in the docs are short on purpose: a comment beside each
# line, no blank lines between definitions.
exclude = ["*.md"]
