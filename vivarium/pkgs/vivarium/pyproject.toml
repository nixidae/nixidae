[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vivarium"
license = "Apache-2.0"
version = "0.1.0"
description = "A session a caller drives: boot guests, run phases, hold, tear down"
requires-python = ">=3.12"
# Read by pyproject-nix when `vivarium-eval` builds this on nanopynix's Python
# set. `default.nix` beside this file declares the same list for the
# nixpkgs build; the two must agree.
dependencies = ["anyio", "certifi", "coverage", "platformdirs", "pydantic", "pytest", "vivarium-agent", "vivarium-ca", "vivarium-runner", "vivarium-socks"]

[project.scripts]
vivarium-runner = "vivarium.cli:main"

# `pytest` drives guests from outside a run: vivarium/pytest_host.py.
[project.entry-points.pytest11]
vivarium = "vivarium.pytest_host"

[tool.hatch.build.targets.wheel]
packages = ["vivarium"]

[tool.pytest.ini_options]
# `anyio_mode` does not exist; the marker plus the `anyio_backend` fixture
# in conftest.py is how anyio's own plugin is driven.
markers = ["anyio"]
