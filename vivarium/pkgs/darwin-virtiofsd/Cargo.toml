[package]
name = "darwin-virtiofsd"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A vhost-user virtio-fs server for macOS hosts"

[dependencies]
bitflags = "1.3"
crossbeam-channel = "0.5"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
nix = { version = "0.30", features = ["fs", "uio", "socket", "poll"] }
virtio-bindings = "0.2"
vm-memory = { version = "0.18", default-features = false, features = ["backend-mmap", "rawfd"] }
