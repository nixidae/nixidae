[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vivarium-runner"
license = "Apache-2.0"
version = "0.2.0"
description = "Run NixOS systems under User-Mode Linux and drive them from Python"
# `os.unshare` and `os.setns` are 3.12.
requires-python = ">=3.12"
dependencies = ["rpyc", "qemu.qmp"]

[project.scripts]
vivarium-run = "vivarium_runner.cli:main"
vivarium-agent = "vivarium_runner.agent:main"

# The backends, by the name `vivarium.backend` gives. Another package adds
# one the same way; `vivarium_runner.backend.get` reads this group.
[project.entry-points."vivarium.backends"]
uml = "vivarium_runner.backend:Uml"
qemu = "vivarium_runner.backend:Qemu"
krun = "vivarium_runner.backend:Krun"
container = "vivarium_runner.backend:Container"

# The console dialects, by the name `vivarium.control.kind` gives.
# `vivarium_runner.control.dialects` reads this group.
[project.entry-points."vivarium.controls"]
routeros = "vivarium_runner.routeros:DIALECT"
sonic = "vivarium_runner.sonic:DIALECT"

[tool.hatch.build.targets.wheel]
packages = ["vivarium_runner"]

# PEP 561: the annotations have to survive the install, or a consumer's
# type checker reads every `vms.node` as Any.
artifacts = ["vivarium_runner/py.typed"]
